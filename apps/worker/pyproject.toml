[project]
name = "agentx-worker"
version = "0.1.0"
description = "Internal worker: ERC-8004 indexing, reference agents, BNBAgent SDK integration."
requires-python = ">=3.10"
dependencies = [
    # Pinned per Phase 0 finding: bnbagent is pre-1.0 and breaking changes are
    # expected. Re-verify against the CHANGELOG before bumping.
    "bnbagent==0.3.6",
    "fastapi>=0.115,<0.116",
    "uvicorn[standard]>=0.30,<0.31",
    "pydantic-settings>=2.4,<3",
    "supabase>=2.7,<3",
    "python-dotenv>=1.0,<2",
    "requests>=2.31,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "httpx>=0.27", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agentx_worker"]
